services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: web_shop
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d web_shop"]
            interval: 5s
            timeout: 5s
            retries: 5

    minio:
        image: minio/minio:latest
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
            MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:10000,http://127.0.0.1:10000"
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 5

    createbuckets:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/files &&
            mc anonymous set download local/files &&
            exit 0"

    stripe-cli:
        image: stripe/stripe-cli:latest
        restart: unless-stopped
        command: >
            listen --api-key ${STRIPE_API_KEY}
            --forward-to host.docker.internal:10000/api/stripe/webhook
            --log-level info
        environment:
            STRIPE_API_KEY: ${STRIPE_API_KEY}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        profiles:
            - stripe

volumes:
    db_data:
    minio_data:
